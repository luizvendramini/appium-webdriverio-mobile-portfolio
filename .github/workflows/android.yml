name: Android Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_DEVICE_NAME: GitHub Actions Emulator
      ANDROID_PLATFORM_VERSION: '14.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2

      - name: Download demo app (Android)
        run: |
          mkdir -p apps
          wget -q https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk -P apps

      # Runners hospedados do GitHub suportam emulacao Android acelerada por
      # hardware (KVM) em runners Linux - isso e 2-3x mais rapido e mais
      # barato que usar um runner macOS so para rodar o emulador Android.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: npm run android

      - name: Upload Appium logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs-android
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
